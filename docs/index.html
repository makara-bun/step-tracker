<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pip Steps</title>
  <meta name="description" content="Log your steps and watch Pip walk up the hill.">
  <meta name="theme-color" content="#7FD1E8">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/grandstander.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="app.css">
  <script src="js/theme.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body class="min-h-dvh bg-soil font-body text-cream">
  <div class="pointer-events-none absolute inset-x-0 top-2 z-10 mx-auto flex max-w-xl justify-end px-3 sm:px-4">
    <button id="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Night mode" class="theme-toggle pointer-events-auto">
      <span class="theme-knob"></span>
      <svg viewBox="0 0 24 24" class="relative size-6" aria-hidden="true">
        <path class="stroke-on-air" d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M5 5l1.8 1.8M17.2 17.2 19 19M5 19l1.8-1.8M17.2 6.8 19 5" stroke-width="2" stroke-linecap="round"/>
        <circle cx="12" cy="12" r="5" fill="#FFC93C" stroke="#14233B" stroke-width="1.5"/>
      </svg>
      <svg viewBox="0 0 24 24" class="relative size-6" aria-hidden="true">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" fill="#F3EDC8" stroke="#14233B" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
  <div id="view"></div>
  <noscript>
    <p class="p-6 text-lg">Pip Steps saves your steps in your browser, so it needs JavaScript turned on.</p>
  </noscript>
  <p id="toast" role="status" class="toast" hidden></p>
</body>
</html>
